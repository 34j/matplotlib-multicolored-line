[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "matplotlib-multicolored-line"
version = "1.0.0"
description = "Plot multicolored lines in Matplotlib"
readme = "README.md"
license = "CC0-1.0"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "matplotlib>=3.11.2",
]
urls."Bug Tracker" = "https://github.com/34j/matplotlib-multicolored-line/issues"
urls.Changelog = "https://github.com/34j/matplotlib-multicolored-line/blob/main/CHANGELOG.md"
urls.documentation = "https://matplotlib-multicolored-line.readthedocs.io"
urls.repository = "https://github.com/34j/matplotlib-multicolored-line"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.ignore = [
  "A001",    # Built-in name shadowed by Sphinx configuration.
  "C901",    # The plotting API keeps its input-shape branches together.
  "D401",    # Preserve the existing Sphinx callback docstring.
  "DOC501",  # Existing public API documents its raised ValueError behavior.
  "NPY002",  # Preserve NumPy's global random helpers in visual test fixtures.
  "PLR2004", # Shape dimensions are intentionally compared with literals.
  "PT006",   # Keep the existing readable parametrization declaration.
  "TC002",   # Runtime imports are required by Matplotlib annotations.
]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
